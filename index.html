  <script>
    // Tema: sayfa çizilmeden önce uygula (beyaz yanıp sönme olmasın)
    (function () {
      try {
        var r = JSON.parse(localStorage.getItem('ekalpr-resolved') || 'null');
        var el = document.documentElement;
        if (r) {
          el.setAttribute('data-theme', r.theme); el.setAttribute('data-pack', r.pack);
          if (r.motion) el.setAttribute('data-motion', r.motion);
        } else {
          var t = localStorage.getItem('ekalpr-theme') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
